    <path d="M 12 28 C 12 39, 36 39, 36 28" fill="none" stroke="url(#marineGrad)" stroke-width="2.5" stroke-linecap="round" />
    <polyline points="9,26 12,28 15,26" fill="none" stroke="url(#marineGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="33,26 36,28 39,26" fill="none" stroke="url(#marineGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
