      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#000f22" />
    </linearGradient>
    <linearGradient id="marineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#86f2e4" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" />
  <circle cx="96" cy="96" r="76" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Anchor & Marine Symbol -->
